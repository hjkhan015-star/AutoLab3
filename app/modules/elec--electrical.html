<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0d13">
<title>Battery · Starter · Alternator — Auto Lab</title>
<link rel="stylesheet" href="../core/app.css">
<link rel="stylesheet" href="../core/controls.css">
<style>
  /* ═══════════════════════════════════════════════════════════
     PANEL TEXT — mode description, chemistry equation
     ═══════════════════════════════════════════════════════════ */
  #electrical-notes { margin-top: var(--s-1); }

  #mode-desc {
    font-size: var(--fs-md); line-height: 1.55;
    color: var(--text-dim);
  }
  #mode-desc strong { color: var(--text); font-weight: 700; }
  #mode-desc em { color: var(--c-orange); font-style: normal; font-weight: 700; }

  #chem-eq {
    margin-top: var(--s-2h); padding: var(--s-1h) var(--s-2h); border-radius: 8px;
    background: color-mix(in oklch, var(--c-green) 10%, transparent);
    border: 1px solid color-mix(in oklch, var(--c-green) 28%, transparent);
    font-family: var(--font-mono);
    font-size: var(--fs-xs); font-weight: 700;
    color: var(--c-green);
    text-align: center; letter-spacing: .02em;
  }
  #chem-eq .arrow { color: var(--c-orange); padding: 0 var(--s-1h); }

  /* ═══════════════════════════════════════════════════════════
     WIDGET INTERIOR — direction toggle (battery mode)
     ═══════════════════════════════════════════════════════════ */

  /* ═══════════════════════════════════════════════════════════
     WIDGET INTERIOR — ignition key selector (charging mode)
     ═══════════════════════════════════════════════════════════ */

</style>
</head>
<body>
  <div id="canvas-wrap"></div>
  <div id="labels-root"></div>

  <script src="../core/guard.js"></script>
  <!--importmap:begin-->
<script type="importmap">
{ "imports": {
  "three": "../assets/three.module.js",
  "three/addons/controls/OrbitControls.js": "../assets/orbit-controls.js",
  "three/addons/environments/RoomEnvironment.js": "../assets/room-environment.js"
} }
</script>
<!--importmap:end-->

  <script type="module" src="elec--electrical.js"></script>
</body>
</html>
