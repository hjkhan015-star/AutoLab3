<title>Hydraulic Braking System — Auto Lab</title>

<style>
  .br-pascal {
    margin-top: var(--s-3);
    padding: var(--s-2h) var(--s-3);
    border-radius: var(--r-sm);
    background: color-mix(in oklch, var(--accent) 8%, transparent);
    border: 1px solid color-mix(in oklch, var(--accent) 22%, transparent);
    font-family: var(--font-mono);
  }
  .br-pascal .label {
    font-size: var(--fs-2xs); letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--text-mute);
    font-family: var(--font-sans);
    font-weight: 700; margin-bottom: var(--s-1);
  }
  .br-pascal .eq {
    font-size: var(--fs-sm); font-weight: 800;
    color: var(--accent);
    margin-bottom: var(--s-1h);
  }
  .br-pascal .note {
    font-size: var(--fs-xs); line-height: 1.5; color: var(--text-dim);
    font-family: var(--font-sans);
  }


</style>
